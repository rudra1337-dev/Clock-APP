 <!DOCTYPE html>

<html>
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <title>Hello, World!</title>
  <link rel="stylesheet" href="page.css">
  <link rel="stylesheet" href="clock.css">
  <link rel="stylesheet" href="alaram.css">
  <link rel="stylesheet" href="stopwatch.css">
  <link rel="stylesheet" href="timer.css">
</head>
<body>
  <header>
    
    <div class="clockBox">
      <div id="clock">
      <h1 class="hed">Clock</h1>
      <div class="themChanger">
        <i class="fa-solid fa-cloud-sun darkMod"></i>
        <i class="fa-solid fa-cloud-moon whiteMod"></i>
      </div>
    </div>
    </div>
    
    <div class="alaramBox">
      <div id="alaram">
      <h1 class="hed">Alaram</h1>
      <div class="themChanger">
        <i class="fa-solid fa-cloud-sun darkMod"></i>
        <i class="fa-solid fa-cloud-moon whiteMod"></i>
      </div>
    </div>
    </div>
    
    <div class="timerBox">
      <div id="timer">
      <h1 class="hed">Timer</h1>
      <div class="themChanger">
        <i class="fa-solid fa-cloud-sun darkMod"></i>
        <i class="fa-solid fa-cloud-moon whiteMod"></i>
      </div>
    </div>
    </div>
    
    <div class="stopWBox">
      <div id="stopW">
      <h1 class="hed">Stopwatch</h1>
      <div class="themChanger">
        <i class="fa-solid fa-cloud-sun darkMod"></i>
        <i class="fa-solid fa-cloud-moon whiteMod"></i>
      </div>
    </div>
    </div>
    
    
    
  </header>
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  <section>
    
    
    <!--CLOCK SECTION-->
    
    <div class="clockBox">
      <div id="clockS">
      <div class="clock-section">
        <div id="time">
          <pre><h1 id="hours">00</h1><h1>:</h1><h1 id="minutes">00</h1><h1>:</h1><h1 id="seconds">00</h1></pre>
        </div>
        <div id="region">
          <h2 id="timezone">India</h2>
        </div>
        <div id="date-details">
          <pre>
            <h3 id="date">JAN</h3>
            <h3>/</h3>
            <h3 id="month">00</h3>
            <h3>/</h3>
            <h3 id="year">0000</h3>
          </pre>
        </div>
      </div>
     <div class="clock-section"></div>
    </div>
    </div>
    
    
    
    
    
    
    <!--AUDIO SECTION-->
    <audio src="ALARAM.mp3" id="alAudio" loop></audio>
    <audio src="TOUCH.wav" id="touchAudio"></audio>
    <audio src="TIMER.mp3" id="timerAudio" ></audio>
    
    
    
    
    
    <!--ALARAM SECTION-->
    
    <div class="alaramBox">
      <div id="alaramS">
      <div id="alIn">
        <input id="H" class="In mainBgColor" type="number" value="00">
        <h1>:</h1>
        <input id="M" class="In mainBgColor" type="number" value="00">
      </div>
      
      <div id="dynamicUpdate">
        
        <!--     <div class="lables">
          
          <span class="lableTime"><h1 class="alHour">00</h1><h1>:</h1><h1 class="alMinut">00</h1></span>
          
          <div class="crossIcon">
            <i class="fa-solid fa-xmark"></i>
          </div>
          
        </div>      -->
        
        <button id="alAdd">
          <i class="fa-solid fa-plus"></i>
        </button>
      </div>
      
      <div class="alPage">
        <div class="nontfication">
          <div class="notiTime">
            <pre><h1>NOW </h1></pre><h1 class="notiH">00</h1><h1>:</h1><h1 class="notiM">00</h1>
            
            <pre><h1> <i class="fa-solid fa-bell"></i></h1></pre>
          </div>
          <div class="notiOk">OK</div>
        </div>
        
      </div>
    </div>
    </div>
    
    
    
    
    
    
    
    <!--TIMER SECTION-->
    
    <div class="timerBox">
      <div id="timerS">
        
        <div id="inTi">
          <input id="h" class="tiIn mainBgColor" type="number" value="00">
        <h1>:</h1>
        <input id="m" class="tiIn mainBgColor" type="number" value="00">
        <h1>:</h1>
        <input id="s" class="tiIn mainBgColor" type="number" value="00">
      </div>
      
      <div id="dynamicUpdate">
        
        <button id="tiAdd">
          <i class="fa-solid fa-play"></i>
        </button>
        
        <div class="timerFunc">
          <div class="playFunc">
          <button id="tiAddOne">
            <i class="fa-solid fa-plus"></i>
          <i class="fa-solid fa-1"></i>
          </button>
          <button id="tiCross">
            <i class="fa-solid fa-xmark"></i>
          </button>
          <button id="tiPause">
            <i class="fa-solid fa-pause pauseIcon"></i>  
          </button>
        </div>
        </div>
      </div>
        
      </div>
    </div>
    
    
    
    
    
    
    
    
    <!--STOPWATCH SECTION-->
    
    <div class="stopWBox">
      <div id="stopwS">
        <div id="inSw">
          <input id="swM" class="swIn" type="number" value="00">
        <h1>:</h1>
        <input id="swS" class="swIn" type="number" value="00">
        <h1>:</h1>
        <input id="swMs" class="swIn" type="number" value="00">
      </div>
      
      <div id="stDynamicUpdate">
        
        <div id="fixedLable" class="stLables">
          <div class="stSlNo">
            <i id="fixedIcon"></i>
          </div>
          
          <span class="stDifferTime"><h1 class="diMinut">00</h1><h1>:</h1><h1 class="diSec">00</h1><h1>:</h1><h1 class="diMS">00</h1></span>
          
          <span class="stLableTime"><h1 id="fStMinut" class="stMinut">00</h1><h1>:</h1><h1 id="fStSec" class="stSec">00</h1><h1>:</h1><h1 id="fStMS" class="stMS">00</h1></span>
         
        </div>
        
        
        <div id="swFunctions">
          <button id="swReset" class="swFunBtn">
            <i class="fa-solid fa-rotate"></i>
          </button>
          <button id="swAdd">
            <i id="AddSw" class="fa-solid fa-play"></i>
          </button>
          <button id="swMark" class="swFunBtn">
            <i class="fa-solid fa-flag"></i>
          </button>
        </div>
        
      </div>
      
      </div>
    </div>
    
    
    
    
    
    
    
    
    
    
    
  </section>
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  <footer>
    <div id="Clock">
      <i class="fa-solid fa-clock"></i>
      <p>Clock</p>
    </div>
    <div id="Alaram">
      <i class="fa-solid fa-bell"></i>
      <p>Alaram</p>
    </div>
    <div id="Timer">
      <i class="fa-solid fa-hourglass"></i>
      <p>Timer</p>
    </div>
    <div id="Stopwatch">
      <i class="fa-solid fa-stopwatch"></i>
      <p>Stopwatch</p>
    </div>
  </footer>
</body>
<script src="page.js"></script>
<script src="time.js"></script>
<script src="alaram.js"></script>
<script src="timer.js"></script>
<script src="stopwatch.js"></script>
<script src="https://kit.fontawesome.com/da0413fe69.js" crossorigin="anonymous"></script>
</html>
